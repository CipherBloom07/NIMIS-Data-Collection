name: NIMIS PWA validation
on:
  push:
    branches: [main, feat/offline-pwa-foundation, feat/collect-v1-brand-responsive]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install
      - name: Foundation regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
