name: NIMIS PWA validation
on:
  push:
    branches: [main, feat/offline-pwa-foundation, feat/official-readiness-identity-v1, feat/collector-correction-ux-v1, feat/collector-quality-demo-v1, feat/security-hardening-pilot-v1, feat/presentation-collector-sync-v1]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nimis_collect_dev
          POSTGRES_USER: nimis_demo
          POSTGRES_PASSWORD: ci-only-postgres-test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nimis_demo -d nimis_collect_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Validate local PowerShell launch syntax
        shell: pwsh
        run: |
          $scripts = @('scripts/START_POSTGRES_LOCAL.ps1', 'scripts/START_CONNECTED_COLLECTOR_PILOT.ps1')
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($error in $errors) { Write-Error "$path : $error" }
              throw "PowerShell syntax validation failed: $path"
            }
            Write-Host "POWERSHELL_PARSE_PASS: $path"
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install
      - name: Foundation regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL integration test dependencies
        run: python -m pip install -r server/requirements-postgres.txt
      - name: Test scoped reference API and real PostgreSQL database
        env:
          NIMIS_TEST_POSTGRES_URL: postgresql://nimis_demo:ci-only-postgres-test@127.0.0.1:55432/nimis_collect_dev
        run: python -m pytest server/tests -q
