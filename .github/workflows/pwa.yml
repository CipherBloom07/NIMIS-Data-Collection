name: NIMIS PWA validation
on:
  push:
    branches: [main, feat/offline-pwa-foundation]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install
      - name: Foundation regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference API test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Test scoped reference API
        run: python -m pytest server/tests -q
